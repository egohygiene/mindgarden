name: Publish reviewed Python release evidence

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Reviewed exact version tag matching pyproject.toml
        required: true
        type: string
      expected-source-revision:
        description: Reviewed full current-main source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mindgarden-release-${{ inputs.release-version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact reviewed default-branch candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require the exact current default branch
        env:
          EXPECTED_SOURCE: ${{ inputs.expected-source-revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]
          [[ "${EXPECTED_SOURCE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE}" ]]
          [[ "$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | cut -f 1)" == "${EXPECTED_SOURCE}" ]]
          if [[ "${REQUESTED_VERSION}" != v0.* ]]; then
            echo "::error::1.0 publication requires the separate #19 acceptance checkpoint"
            exit 2
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install pinned release tools
        run: python -m pip install --requirement requirements/release.txt
      - name: Fetch exact public owner contracts
        run: python scripts/release.py bootstrap
      - name: Prepare and strictly verify the candidate
        env:
          VERSION: ${{ inputs.release-version }}
          SOURCE: ${{ inputs.expected-source-revision }}
        run: |
          python scripts/release.py prepare --release-version "${VERSION}" \
            --source-revision "${SOURCE}" --output-directory .cache/release-candidate
          python scripts/release.py verify --release-version "${VERSION}" \
            --output-directory .cache/release-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindgarden-release-candidate
          path: .cache/release-candidate/
          if-no-files-found: error

  publish:
    name: Relay immutable GitHub evidence
    needs: prepare
    permissions:
      actions: read
      contents: write
    uses: egohygiene/relay/.github/workflows/semantic-release.yml@b4a88db20bc26f9ddefbee174baa8162cbe94ff2
    with:
      artifact-name: mindgarden-release-candidate
      release-version: ${{ inputs.release-version }}
      expected-source-revision: ${{ inputs.expected-source-revision }}
      profile: python-package
      component-id: mindgarden
      release-name: mindgarden
      update-major-alias: false

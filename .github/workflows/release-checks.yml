name: Check release preparation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-preparation:
    name: Reproducible local candidate and explicit external gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install pinned release tools
        run: python -m pip install --requirement requirements/release.txt
      - name: Bootstrap exact owner sources
        run: python scripts/release.py bootstrap
      - name: Validate the version authority and release declaration
        run: python scripts/release.py plan
      - name: Build twice and verify candidate artifacts
        run: |
          python scripts/release.py prepare --output-directory .cache/release-candidate \
            > .cache/release-preparation.json
          python scripts/release.py verify --output-directory .cache/release-candidate \
            --artifact-only > .cache/release-verification.json
      - name: Preserve qualified artifacts and blocked external states
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindgarden-local-release-evidence
          path: |
            .cache/release-candidate/
            .cache/release-preparation.json
            .cache/release-verification.json
          if-no-files-found: error

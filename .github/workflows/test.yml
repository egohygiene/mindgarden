name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Node 24
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install package builder
        run: python -m pip install --disable-pip-version-check "build==1.3.0"

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir ".cache/dist"

      - name: Install wheel into a clean environment
        run: |
          python -m venv ".cache/package-smoke"
          ".cache/package-smoke/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links ".cache/dist" \
            "mindgarden==0.1.0"

      - name: Smoke-test the installed command and library
        run: |
          ".cache/package-smoke/bin/mindgarden" --version
          ".cache/package-smoke/bin/mindgarden" version
          ".cache/package-smoke/bin/mindgarden" validate \
            --repository-root "tests/fixtures/public-garden"
          ".cache/package-smoke/bin/mindgarden" verify \
            --repository-root "tests/fixtures/public-garden"
          ".cache/package-smoke/bin/mindgarden" publish verify \
            --repository-root "tests/fixtures/public-garden"
          ".cache/package-smoke/bin/python" -c \
            "from pathlib import Path; import mindgarden; assert mindgarden.__version__ == '0.1.0'; assert mindgarden.validate_repository(Path('tests/fixtures/public-garden')) == 3"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run standalone test suite
        run: python -m unittest discover --start-directory tests --verbose

      - name: Verify Node.js major used by Quartz profiles
        run: node --version | grep --extended-regexp "^v24\\."
